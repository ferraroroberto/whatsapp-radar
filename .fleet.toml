# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which fails on a
# duplicate block (jscpd via npx, Python and JS) or an unused import/variable (ruff
# F401,F841) that is not in .static-ratchet-baseline.json. Needs Node and ruff in
# the gate's venv; a detector that cannot run exits 3, which fails the gate. Vendored
# copies are duplicates by design, so they are excluded. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py through
# scripts/docs_ratchet_gate.py, which fails when README.md grows past 40 KiB or
# past its baselined size, or when README.md or docs/**/*.md gains a history marker
# (an issue reference, a dated heading or a changelog heading) beyond
# .docs-ratchet-baseline.json. It reads the whole tree, so it is never path-routed;
# exit 3 (git unusable, a non-UTF-8 file, an unclosed fence) is NOT CONFIRMED and
# fails. Docs here are all hand-written, so nothing is excluded. Procedure + limits:
# project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"
# Open upstream gaps the docs point at (a missing hub option; an API that does not dedupe).
allow_refs = ["ferraroroberto/local-llm-hub#128", "task-os#98"]

# [comment_ratchet] -- the scaffold's baseline-and-ratchet comment check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py through
# scripts/comment_ratchet_gate.py, which fails when a file carries more `#NNN` issue
# references inside code comments than .comment-ratchet-baseline.json records for it
# (a comment states the present-tense why; history lives in git, PRs and issues).
# Vendored destinations are excluded automatically. It reads the whole tree, so it is
# never path-routed; exit 3 (git unusable, a file it cannot scan) is NOT CONFIRMED and
# fails. Procedure + limits: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py through
# scripts/structure_ratchet_gate.py, which fails when a file passes 1,000 lines, a
# function 100 lines or a flat directory 40 modules, when a baselined offender grows
# past its size in .structure-ratchet-baseline.json, when src/ imports app/, and when
# the root folders do not match `shape` plus `extra_roots`. Existing offenders are
# baselined at today's size, never excluded. It reads the whole tree, so it is never
# path-routed; exit 3 (git unusable, an unparseable file, an unknown shape) is NOT
# CONFIRMED and fails. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet instruction-file lint. The
# gate (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py through
# scripts/instruction_ratchet_gate.py, which fails when CLAUDE.md or AGENTS.md gains a hit
# of the weekly prompt audit's deterministic rules, or passes its size cap, beyond
# .instruction-ratchet-baseline.json. This repo ships no skills or rules files, so the
# defaults cover it. It reads the whole tree, so it is never path-routed; exit 3 (git
# unusable, an unreadable file) is NOT CONFIRMED and fails. Procedure + limits:
# project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open
# surface; this app stamps html[data-theme] at load from wa-radar.theme (else the OS
# scheme), so the hook has to set that key too or its dark shots stay light.
[design.review]
theme_storage_key = "wa-radar.theme"

# `measure --e2e` and `--synthetic` walk this throwaway webapp (the e2e autoboot's
# sanitized seeded DB, fixture connector, temp runtime paths), never the live tray
# on :8455 (scripts/design_review_synthetic.py).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60

# `measure --e2e` runs the suite with the surface() hook armed. Without the flag the
# live-tray guard would refuse while :8455 is occupied, so autoboot is explicit.
[design.review.e2e]
command = ["-m", "pytest", "tests/e2e", "--e2e-autoboot", "-q"]
timeout_s = 900

# Diff-proportionate e2e routing (project-scaffolding#180, schema:
# project-scaffolding/docs/e2e-routing.md). Rules are evaluated top-to-bottom;
# FIRST MATCH WINS -- a narrow rule for a subtree must precede the broader
# rule for its enclosing prefix. Unmatched paths fail safe to "full"
# (scripts/classify_e2e.py); this table only ever narrows what an
# already-recognized-as-narrow diff runs, never what an unmatched one runs.
# Update in the same PR as any new e2e-relevant directory.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# Ratchet at the current collected-node size (pytest --collect-only tests/e2e);
# lower it as the suite trims, never raise it without deleting tests first.
test_budget           = 58

# Inert image/font/manifest assets under the static tree -> smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "woff", "woff2", "ttf", "webmanifest"]

# Vendored HTML fragments are pure markup; their .css/.js siblings are NOT
# covered here and fall through to "full" below (real nav/icon behaviour).
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html", "md"]

# The e2e suite itself, and its shared conftest/helpers -- a harness change
# must be exercised by running the harness.
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"

# The whole FastAPI + PWA product: routers (the browser's API surface),
# middleware, server boot, the static tree.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"

# The Windows tray that owns the webapp lifecycle.
[[e2e.rule]]
tier   = "full"
prefix = "app/tray/"

# The argparse CLI has no browser UI of its own.
[[e2e.rule]]
tier       = "none"
prefix     = "app/cli/"
extensions = ["py"]

# Domain logic with no UI template of its own -- no browser impact unless
# paired with an app/webapp/ change (which already routes full above).
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]

# Portable Google API clients + the read-only WhatsApp connector -- backend
# only, no rendered surface.
[[e2e.rule]]
tier   = "none"
prefix = "calendar_readonly/"
[[e2e.rule]]
tier   = "none"
prefix = "calendar_write/"
[[e2e.rule]]
tier   = "none"
prefix = "gmail_readonly/"
[[e2e.rule]]
tier   = "none"
prefix = "google_oauth_common/"
[[e2e.rule]]
tier   = "none"
prefix = "sidecar/"

[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
[[e2e.rule]]
tier   = "none"
prefix = "assets/"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"

# Non-e2e tests (tests/e2e/ already matched full above).
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

# Repo meta / docs / launcher scripts -- no runtime behaviour of their own;
# the e2e fixture boots the app directly, not through these .bat wrappers.
[[e2e.rule]]
tier = "none"
path = ".fleet.toml"
[[e2e.rule]]
tier = "none"
path = ".gitignore"
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".comment-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".instruction-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = "LICENSE"
[[e2e.rule]]
tier = "none"
path = "AGENTS.md"
[[e2e.rule]]
tier = "none"
path = "CLAUDE.md"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
[[e2e.rule]]
tier       = "none"
extensions = ["bat", "sh"]
