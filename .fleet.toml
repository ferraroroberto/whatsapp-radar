# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which fails on a
# duplicate block (jscpd via npx, Python and JS), an unused import/variable (ruff
# F401,F841) or a likely bug or security pattern (ruff's curated B and S codes, with
# S113 strict) that is not in .static-ratchet-baseline.json. Needs Node and ruff in
# the gate's venv; a detector that cannot run exits 3, which fails the gate. Vendored
# copies are duplicates by design, so they are excluded. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py through
# scripts/docs_ratchet_gate.py, which fails when README.md grows past 40 KiB or
# past its baselined size, or when README.md or docs/**/*.md gains a history marker
# (an issue reference, a dated heading or a changelog heading) beyond
# .docs-ratchet-baseline.json. It reads the whole tree, so it is never path-routed;
# exit 3 (git unusable, a non-UTF-8 file, an unclosed fence) is NOT CONFIRMED and
# fails. Docs here are all hand-written, so nothing is excluded. Procedure + limits:
# project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"
# Open upstream gaps the docs point at (a missing hub option; an API that does not dedupe).
allow_refs = ["ferraroroberto/local-llm-hub#128", "task-os#98"]

# [comment_ratchet] -- the scaffold's baseline-and-ratchet comment check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py through
# scripts/comment_ratchet_gate.py, which fails when a file carries more `#NNN` issue
# references inside code comments than .comment-ratchet-baseline.json records for it
# (a comment states the present-tense why; history lives in git, PRs and issues).
# Vendored destinations are excluded automatically. It reads the whole tree, so it is
# never path-routed; exit 3 (git unusable, a file it cannot scan) is NOT CONFIRMED and
# fails. Procedure + limits: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
docstrings      = true
history_phrases = true

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py through
# scripts/structure_ratchet_gate.py, which fails when a file passes 1,000 lines, a
# function 100 lines or a flat directory 40 modules, when a baselined offender grows
# past its size in .structure-ratchet-baseline.json, when src/ imports app/, and when
# the root folders do not match `shape` plus `extra_roots`. Existing offenders are
# baselined at today's size, never excluded. It reads the whole tree, so it is never
# path-routed; exit 3 (git unusable, an unparseable file, an unknown shape) is NOT
# CONFIRMED and fails. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet instruction-file lint. The
# gate (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py through
# scripts/instruction_ratchet_gate.py, which fails when CLAUDE.md or AGENTS.md gains a hit
# of the weekly prompt audit's deterministic rules, or passes its size cap, beyond
# .instruction-ratchet-baseline.json. This repo ships no skills or rules files, so the
# defaults cover it. It reads the whole tree, so it is never path-routed; exit 3 (git
# unusable, an unreadable file) is NOT CONFIRMED and fails. Procedure + limits:
# project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"
ci_expectations     = true
agents_pointer      = true
claude_md_max_lines = 120
repeated_text_words = 12

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet doc-reference check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py through
# scripts/doc_refs_ratchet_gate.py, which fails when README.md, CLAUDE.md or docs/**/*.md
# names a repo path, `python -m` module or relative link that does not exist, beyond
# .doc-refs-ratchet-baseline.json. The declared `port` makes it check loopback ports in the
# docs too: only this app's own port resolves, so the sibling services the docs name (hub,
# whisper) are listed in `allow_refs`. It reads the whole tree,
# so it is never path-routed; exit 3 (git unusable, a non-UTF-8 file, an unclosed fence)
# is NOT CONFIRMED and fails. Procedure + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"
# App Launcher's gitignored runtime registries, named in the docs as that repo's files,
# and the loopback ports of the sibling services the docs call (hub, home-automation, task-os).
allow_refs = ["config/apps.json", "config/jobs.json", ":8000", ":8447", ":8448"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet dead-code check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py through
# scripts/dead_code_ratchet_gate.py, which fails when a tracked Python function, class or
# method that nothing in the repo refers to is not already in
# .dead-code-ratchet-baseline.json. Vendored destinations are read for references but never
# reported. It reads the whole tree, so it is never path-routed; exit 3 (git unusable, a
# file that does not parse) is NOT CONFIRMED and fails. Procedure + limits:
# project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet fleet-convention check. The
# gate (scripts/verify-before-ship.ps1) runs scripts/conventions_ratchet.py through
# scripts/conventions_ratchet_gate.py, which fails when a file has more hits of an enabled
# rule than .conventions-ratchet-baseline.json records for it. Vendored destinations are
# never scanned. It reads the whole tree, so it is never path-routed; exit 3 (git unusable,
# a Python file that does not parse) is NOT CONFIRMED and fails. Rules enabled:
#   no-window      -- the app is Windows-first: every subprocess spawn hides the console.
#   no-drive-path  -- no hardcoded drive-letter location; runtime paths come from config.
#   logging-not-print -- library code under app/ and src/ logs; CLI modules print by design.
#   password-input-vendored -- the only password input is the vendored sign-in sheet.
#   login-lockout  -- the password route answers 429 + Retry-After after repeated wrong passwords.
# secret-compare and git-wrapper stay off: this repo has no constant-time-compare helper and
# no git wrapper for them to enforce. Procedure + limits:
# project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path", "password-input-vendored", "login-lockout", "subprocess-timeout"]

# A raw connect skips the WAL pragma, the schema and the migrations.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/db/connection.py"]
why    = "src/db/connection.py is the one SQLite connection helper (WAL, schema, migrations)"

# A raw replace skips the unique temp name and the cleanup on a failed write.
[[conventions_ratchet.must_use]]
call   = "os.replace"
helper = ["src/atomic_write.py"]
why    = "src/atomic_write.py is the one atomic file writer (unique temp, cleanup on failure)"

# Outbound HTTP goes through the pooled session, not a bare requests call.
[[conventions_ratchet.must_use]]
call   = ["requests.get", "requests.post", "requests.put", "requests.patch", "requests.delete", "requests.head", "requests.request"]
helper = ["src/pooled_http.py"]
why    = "CLAUDE.md: outbound-connection discipline, one pooled session"
paths  = ["app/", "src/"]

# [runtime_write_ratchet] -- the scaffold's baseline-and-ratchet runtime-write check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/runtime_write_ratchet.py through
# scripts/runtime_write_ratchet_gate.py, which fails when a tracked Python file gains a write
# target (open, write_text, mkdir, a file log handler, sqlite3.connect, ...) resolving under a
# code folder beyond .runtime-write-ratchet-baseline.json: runtime output belongs under the
# runtime root (src/runtime_data.py) or data/. A target it cannot resolve is unknown, exit 3,
# NOT CONFIRMED -- never clean. The same script brackets the pytest stages with --snapshot and
# --probe, which fails on any file the test runs left under a code folder. All the code lives
# under src/ (the sidecar connector included), app/ and scripts/. It reads the whole tree, so
# it is never path-routed. Procedure + limits: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled      = true
baseline     = ".runtime-write-ratchet-baseline.json"
code_folders = ["src", "app", "scripts"]

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".usage-track-ratchet-baseline.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired"]

# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open
# surface; this app stamps html[data-theme] at load from wa-radar.theme (else the OS
# scheme), so the hook has to set that key too or its dark shots stay light.
[design.review]
theme_storage_key = "wa-radar.theme"

# /perf-review's "ready": the Home glance rows carrying live data. Without a selector it
# reads first contentful paint, which goes green on the placeholder rows before any data.
[perf.review]
ready_selector = '#dashGlance[data-state="ready"] .glance-row'

# `measure --e2e` and `--synthetic` walk this throwaway webapp (the e2e autoboot's
# sanitized seeded DB, fixture connector, temp runtime paths), never the live tray
# on :8455 (scripts/design_review_synthetic.py).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60

# `measure --e2e` runs the suite with the surface() hook armed. Without the flag the
# live-tray guard would refuse while :8455 is occupied, so autoboot is explicit.
[design.review.e2e]
command = ["-m", "pytest", "tests/e2e", "--e2e-autoboot", "-q"]
timeout_s = 900

# Diff-proportionate e2e routing (project-scaffolding#180, schema:
# project-scaffolding/docs/e2e-routing.md). Rules are evaluated top-to-bottom;
# FIRST MATCH WINS -- a narrow rule for a subtree must precede the broader
# rule for its enclosing prefix. Unmatched paths fail safe to "full"
# (scripts/classify_e2e.py); this table only ever narrows what an
# already-recognized-as-narrow diff runs, never what an unmatched one runs.
# Update in the same PR as any new e2e-relevant directory.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# Ratchet at the current collected-node size (pytest --collect-only tests/e2e);
# lower it as the suite trims, never raise it without deleting tests first.
test_budget           = 14

# Inert image/font/manifest assets under the static tree -> smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "woff", "woff2", "ttf", "webmanifest"]

# Vendored HTML fragments are pure markup; their .css/.js siblings are NOT
# covered here and fall through to "full" below (real nav/icon behaviour).
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html", "md"]

# The e2e suite itself, and its shared conftest/helpers -- a harness change
# must be exercised by running the harness.
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"

# The whole FastAPI + PWA product: routers (the browser's API surface),
# middleware, server boot, the static tree.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"

# The Windows tray that owns the webapp lifecycle.
[[e2e.rule]]
tier   = "full"
prefix = "app/tray/"

# The argparse CLI has no browser UI of its own.
[[e2e.rule]]
tier       = "none"
prefix     = "app/cli/"
extensions = ["py"]

# Domain logic with no UI template of its own -- no browser impact unless
# paired with an app/webapp/ change (which already routes full above).
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]

# The read-only WhatsApp connector -- backend only, no rendered surface.
[[e2e.rule]]
tier   = "none"
prefix = "src/sidecar/"

[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
[[e2e.rule]]
tier   = "none"
prefix = "assets/"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"

# Non-e2e tests (tests/e2e/ already matched full above).
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

# Repo meta / docs / launcher scripts -- no runtime behaviour of their own;
# the e2e fixture boots the app directly, not through these .bat wrappers.
[[e2e.rule]]
tier = "none"
path = ".fleet.toml"
[[e2e.rule]]
tier = "none"
path = ".gitignore"
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".comment-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".instruction-ratchet-baseline.json"
