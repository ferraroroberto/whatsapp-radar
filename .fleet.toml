# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "💬"
description = "Cut attention load from busy chats."
tag         = ["uses", "hub"]
shape       = "webapp-tray"
# Root folders the shape does not list: the four portable Google packages (shared with
# sibling repos, so deliberately outside src/) and the separate Node connector process.
# docs/layout.md says why each stays.
extra_roots = ["calendar_readonly", "calendar_write", "gmail_readonly", "google_oauth_common", "sidecar"]

